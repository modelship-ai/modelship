name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write   # create GitHub Releases
  packages: write   # push to GHCR

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # Built once: docker installs these wheels and pypi publishes these same files,
  # so what ships is what the images were built against.
  wheels:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build engine and bootstrapper
        run: |
          uv build -o dist .
          uv build -o dist bootstrap

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [version, wheels]
    strategy:
      # Cheapest-first: thin has no torch/vllm, cpu is the mid-weight build,
      # cuda is the slowest. max-parallel: 1 keeps them sequential in this
      # order so the lightest variant lands in the registry first.
      max-parallel: 1
      matrix:
        include:
          - variant: thin
            platforms: linux/amd64,linux/arm64
            tag_suffix: ""
          - variant: cpu
            platforms: linux/amd64,linux/arm64
            tag_suffix: "-cpu"
          - variant: cuda
            platforms: linux/amd64
            tag_suffix: "-cuda"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: ${{ matrix.platforms }}
          push: true
          build-contexts: |
            wheels=./wheels
          build-args: |
            MSHIP_VARIANT=${{ matrix.variant }}
            MSHIP_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }},ignore-error=true

  # After docker: nothing reaches PyPI that the images were not built from.
  pypi:
    runs-on: ubuntu-latest
    needs: [version, wheels, docker]
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Download release wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      # Engine first: the bootstrapper pins mship-engine==<same version>, so
      # publishing it first would reference a release that doesn't exist yet.
      - name: Publish engine
        run: uv publish dist/mship_engine-*

      - name: Publish bootstrapper
        run: uv publish dist/mship-*

  helm:
    runs-on: ubuntu-latest
    # After docker so a published chart's image tag always exists in GHCR.
    needs: [version, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Log in to GHCR
        run: helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}

      # Vendor the kuberay-operator subchart (pinned in Chart.lock) before packaging
      # so `--set kuberay-operator.enabled=true` works from the published chart.
      - name: Build chart dependencies
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm dependency build helm/modelship

      # Chart version is stamped to the app version at release time (make _release),
      # so it equals the tag and packages to modelship-<version>.tgz.
      - name: Package chart
        run: helm package helm/modelship

      - name: Push chart to GHCR (OCI)
        run: |
          helm push "modelship-${{ needs.version.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

  github-release:
    runs-on: ubuntu-latest
    needs: [version, docker, helm, pypi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Native install (Apple Silicon / homelab)

            ```bash
            uv tool install mship
            mship bootstrap --metal
            mship start --config models.yaml
            ```

            ## Docker images

            ### Thin (control/coordinator — default, no torch/vllm)
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ```

            ### CUDA (GPU node)
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}-cuda
            ```

            ### CPU (CPU node)
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}-cpu
            ```

            Floating tags (`:latest`, `:latest-cuda`, `:latest-cpu`) are single-node only — for any
            multi-node cluster, pin every node to the same `X.Y.Z` tag to avoid a Ray version
            mismatch between head and workers.

            ## Helm chart (Kubernetes)

            ```bash
            helm install modelship \
              oci://ghcr.io/${{ github.repository_owner }}/charts/modelship \
              --version ${{ needs.version.outputs.version }} \
              -f values.yaml
            ```

            ## Running an image

            The images take the same subcommands as the `mship` CLI:

            ```bash
            docker run --rm --shm-size=8g \
              -v ./models.yaml:/modelship/config/models.yaml \
              -v ./models-cache:/.cache \
              -p 8000:8000 \
              ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}-cpu start
            ```

            ## Configuration

            Create a `models.yaml` file and mount it at `/modelship/config/models.yaml`. Example configs for various GPU sizes are included in the image under `/modelship/config/examples/` — use them as a reference for structure and available options, then tailor the models and GPU fractions to your hardware.
