name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # Detect whether this PR touches the Helm chart, so the heavy `chart` job (which
  # spins up a kind cluster) only runs when it's relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chart:
              - 'helm/**'
              - '.github/workflows/ci.yml'
              - 'modelship/deploy/capabilities.py'
              - 'scripts/check_chart_capability_parity.py'
              - 'scripts/check_chart_entrypoint.py'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra cuda

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra cuda

      - name: Run tests
        run: uv run pytest tests/ -v -m "not integration"

  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10.11 predates tarfile's extraction-filter backport.
        python: ["3.10.11", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        working-directory: bootstrap
        run: uv run --python ${{ matrix.python }} --group dev pytest tests/ -v

      - name: Ruff
        working-directory: bootstrap
        run: |
          uvx ruff check .
          uvx ruff format --check .

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # A stale pins file installs the wrong package set on every user's machine
      # rather than failing here.
      - name: Pins match the lock
        run: |
          make pins
          git diff --exit-code bootstrap/mship_bootstrap/pins/

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint chart
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm dependency build helm/modelship
          helm lint helm/modelship

      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          # CRDs (RayCluster/RayJob/PodMonitor) aren't in the standard schema set, so
          # skip those and validate everything else strictly across value permutations.
          # redis.address is required by the chart, so every permutation sets it.
          for args in \
            "" \
            "--set image.variant=cpu" \
            "--set redis.password=pw" \
            "--set podMonitor.enabled=true" \
            "--set rayAuth.enabled=true --set rayAuth.token=t" \
            "--set workerGroups[0].name=cuda --set workerGroups[0].replicas=1 --set workerGroups[0].minReplicas=1 --set workerGroups[0].maxReplicas=1"; do
            echo "== helm template $args =="
            helm template modelship helm/modelship --set redis.address=cache:6379 $args \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: Reject a chart with no Redis address
        run: |
          # redis.address has no durable fallback to degrade to, so an unset one must
          # fail rendering rather than silently produce a cluster with no state store.
          if helm template modelship helm/modelship >/dev/null 2>&1; then
            echo "expected 'helm template' to fail without redis.address"; exit 1
          fi

      - name: Head and RayJob submitter default to the thin image
        run: |
          # The head/submitter never schedule models, so both must stay on the bare
          # (thin) tag regardless of the cluster-wide image.variant — and the head's
          # rayStartParams must pin num-cpus/num-gpus to 0 (KubeRay starts the raylet,
          # so thin's baked MSHIP_NODE_NUM_CPUS/GPUS=0 env doesn't apply on k8s).
          rendered=$(helm template modelship helm/modelship --set redis.address=cache:6379 --set image.variant=cpu)
          echo "$rendered" | grep -qE 'image: ghcr\.io/modelship-ai/modelship:[0-9]+\.[0-9]+\.[0-9]+$'
          ! echo "$rendered" | grep -qE 'image: ghcr\.io/modelship-ai/modelship:[^ ]*-(cpu|cuda)$'
          echo "$rendered" | grep -q 'num-cpus: "0"'
          echo "$rendered" | grep -q 'num-gpus: "0"'

      - name: Worker resources rayStartParam matches its image variant
        run: |
          # cpu omits mship_diffusers (not in the cpu extra — see pyproject.toml's
          # [tool.uv] conflicts).
          common="--set redis.address=cache:6379 --set workerGroups[0].name=w --set workerGroups[0].replicas=1 --set workerGroups[0].minReplicas=1 --set workerGroups[0].maxReplicas=1"
          cuda=$(helm template modelship helm/modelship $common --set workerGroups[0].image.variant=cuda)
          echo "$cuda" | grep -q 'resources:.*mship_diffusers'
          echo "$cuda" | grep -q 'resources:.*mship_vllm'
          cpu=$(helm template modelship helm/modelship $common --set workerGroups[0].image.variant=cpu)
          ! echo "$cpu" | grep -q 'resources:.*mship_diffusers'
          echo "$cpu" | grep -q 'resources:.*mship_vllm'

      - name: Install uv (for the capability-parity check)
        uses: astral-sh/setup-uv@v6

      - name: Chart/Python capability-resource parity
        run: |
          uv run --with pyyaml python scripts/check_chart_capability_parity.py

      - name: RayJob entrypoint delivers models.yaml intact
        run: |
          uv run --no-project --with pyyaml python scripts/check_chart_entrypoint.py

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: modelship-ci

      - name: Server dry-run against real KubeRay CRDs
        run: |
          # Install the operator so the RayCluster/RayJob CRDs exist, then server-side
          # dry-run the chart: the API server validates the CRs (incl.
          # gcsFaultToleranceOptions and authOptions) against the real CRD schemas.
          # Head-only (no workers/cache) so nothing needs GPUs or PVCs.
          # The locked dependency (Chart.lock), not the repo's latest: the CRDs must be
          # the version the chart declares. Already fetched by the lint step; a no-op here.
          helm dependency build helm/modelship
          helm install kuberay-operator helm/modelship/charts/kuberay-operator-*.tgz --wait --timeout 5m
          for args in "" "--set redis.password=pw" "--set rayAuth.enabled=true --set rayAuth.token=t"; do
            echo "== dry-run ${args:-defaults} =="
            helm install modelship helm/modelship \
              --set kuberay-operator.enabled=false \
              --set cache.enabled=false \
              --set redis.address=cache:6379 \
              $args \
              --dry-run=server
          done
