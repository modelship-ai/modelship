{{- $config := .Values.models.config }}
{{- $configPath := printf "/tmp/mship-models-%s.yaml" (sha256sum $config | trunc 12) }}
{{- $args := list "mship" "deploy"
  "--gateway-name" .Values.gateway.name
  "--gateway-replicas" (.Values.gateway.replicas | toString)
  "--config" $configPath
  "--replace-strategy" .Values.deploy.replaceStrategy -}}
{{- if .Values.deploy.reconcile }}{{- $args = append $args "--reconcile" }}{{- end }}
{{- if not .Values.metrics.enabled }}{{- $args = append $args "--no-metrics" }}{{- end }}
{{- range .Values.deploy.extraArgs }}{{- $args = append $args (toString .) }}{{- end }}
{{- range $args }}
{{- if not (regexMatch "^[A-Za-z0-9._=/:,@+-]+$" .) }}
{{- fail (printf "deploy argument %q can't be passed in the RayJob entrypoint: use only letters, digits and ._=/:,@+-" .) }}
{{- end }}
{{- end }}
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: {{ include "modelship.fullname" . }}-deploy
  labels:
    {{- include "modelship.labels" . | nindent 4 }}
  annotations:
    # Re-run on install and every upgrade; delete the previous RayJob first so the
    # updated models.yaml is re-applied (a RayJob is otherwise immutable).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Run against the existing RayCluster instead of creating one, and never tear
  # down a cluster we don't own. KubeRay waits for the cluster to be ready, then
  # submits the entrypoint to run ON the head (where a raylet exists).
  clusterSelector:
    ray.io/cluster: {{ include "modelship.fullname" . }}
  shutdownAfterJobFinishes: false
  # NB: backoffLimit is rejected by KubeRay in clusterSelector mode, so it is not set.
  {{- if .Values.deploy.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.deploy.ttlSecondsAfterFinished }}
  {{- end }}
  # models.yaml rides base64-encoded in the entrypoint. The single-quoted `bash -c` survives
  # the submitter's bash and `ray job submit`'s re-join, so the pipeline runs on the head.
  entrypoint: {{ printf "bash -c 'echo %s | base64 -d > %s && exec %s'" (b64enc $config) $configPath (join " " $args) | quote }}
  # Submitter Job: pin to our image so its `ray job submit` CLI matches the
  # cluster's Ray version.
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ray-job-submitter
          image: {{ include "modelship.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.deploy.resources | nindent 12 }}
