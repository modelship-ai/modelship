apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ include "modelship.fullname" . }}
  labels:
    {{- include "modelship.labels" . | nindent 4 }}
  annotations:
    # KubeRay keeps each Ray container's own args (mship start/join) instead of running `ray start`.
    ray.io/overwrite-container-cmd: "true"
  # Present from creation: KubeRay otherwise adds it by rewriting the whole object.
  finalizers:
    - ray.io/gcs-ft-redis-cleanup-finalizer
spec:
  rayVersion: {{ .Values.rayVersion | quote }}
  # KubeRay injects the token into every Ray pod; the deploy Job reads the same Secret.
  # Without secretName it generates one, in a Secret named after this RayCluster.
  authOptions:
    mode: token
    {{- with .Values.rayAuth.existingSecret }}
    secretName: {{ . }}
    {{- end }}
  # GCS fault tolerance: back the head's GCS with Redis so a restarted head pod
  # recovers cluster state (workers + model actors survive) instead of taking the
  # cluster down. externalStorageNamespace is pinned so a recreated cluster (same
  # name) recovers; KubeRay injects the RAY_REDIS_* env that `mship start` reads.
  gcsFaultToleranceOptions:
    redisAddress: {{ required "redis.address is required (see the chart README)." .Values.redis.address | quote }}
    externalStorageNamespace: {{ include "modelship.storageNamespace" . | quote }}
    {{- if or .Values.redis.password .Values.redis.existingSecret }}
    redisPassword:
      valueFrom:
        secretKeyRef:
          name: {{ include "modelship.redisSecretName" . }}
          key: {{ .Values.redis.passwordKey }}
    {{- end }}
  # ---- Head: CPU-only coordination (GCS, dashboard, Serve proxy). ----
  headGroupSpec:
    rayStartParams: {}
    template:
      metadata:
        labels:
          {{- include "modelship.selectorLabels" . | nindent 10 }}
        {{- with .Values.head.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
        {{- with .Values.imagePullSecrets }}
        imagePullSecrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # KubeRay treats containers[0] as the Ray container.
        containers:
          - name: ray-head
            image: {{ include "modelship.image" . }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            # RAY_PORT is KubeRay's GCS port (6379); the deploy Job reaches the
            # dashboard through the head Service.
            args:
              - start
              - --gcs-port
              - "$(RAY_PORT)"
              - --ray-dashboard-host
              - "0.0.0.0"
              - --enable-ray-auth
              - --gateway-name
              - {{ .Values.gateway.name | quote }}
              - --gateway-min-replicas
              - {{ .Values.gateway.autoscaling.minReplicas | quote }}
              - --gateway-max-replicas
              - {{ .Values.gateway.autoscaling.maxReplicas | quote }}
              - --gateway-target-ongoing-requests
              - {{ .Values.gateway.autoscaling.targetOngoingRequests | quote }}
              - --gateway-max-ongoing-requests
              - {{ .Values.gateway.maxOngoingRequests | quote }}
              - --openai-api-port
              - {{ .Values.gateway.port | quote }}
              {{- if .Values.metrics.enabled }}
              - --metrics-port
              - {{ .Values.metrics.port | quote }}
              {{- else }}
              - --no-metrics
              {{- end }}
            # The deploy Job reaches the dashboard on 8265, mship start's default.
            # KubeRay adds `metrics: 8080` to a Ray container that declares no `metrics` port.
            ports:
              - { name: dashboard, containerPort: 8265 }
              - { name: serve, containerPort: {{ .Values.gateway.port }} }
              - { name: metrics, containerPort: {{ .Values.metrics.port }} }
            # mship start brings the gateway up after both coordinators, so the head turns Ready only
            # once start is done. Readiness and liveness stay KubeRay's.
            startupProbe:
              httpGet:
                path: {{ include "modelship.gatewayPath" . }}/health
                port: serve
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 120
            env:
              {{- include "modelship.env" . | nindent 14 }}
              {{- with .Values.head.env }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            envFrom:
              {{- include "modelship.envFrom" . | nindent 14 }}
            resources:
              {{- toYaml .Values.head.resources | nindent 14 }}
            volumeMounts:
              {{- include "modelship.volumeMounts" . | nindent 14 }}
        volumes:
          {{- include "modelship.volumes" . | nindent 10 }}
        {{- with .Values.head.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.head.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.head.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  # ---- Workers: one group per entry in .Values.workerGroups. ----
  {{- if .Values.workerGroups }}
  workerGroupSpecs:
    {{- range .Values.workerGroups }}
    - groupName: {{ .name }}
      replicas: {{ .replicas }}
      minReplicas: {{ .minReplicas }}
      maxReplicas: {{ .maxReplicas }}
      {{- $img := .image | default dict }}
      rayStartParams: {}
      template:
        metadata:
          labels:
            {{- include "modelship.selectorLabels" $ | nindent 12 }}
          {{- with .annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- with .runtimeClassName }}
          # Optional per-group RuntimeClass (e.g. "nvidia" on k3s/containerd, so the
          # NVIDIA container runtime injects the GPU). Omit on CPU groups / clusters
          # where the GPU runtime is already the default.
          runtimeClassName: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Per-group image override: a worker group may set its own `image`
          # (repository/tag/variant/pullPolicy); any field left unset falls back to
          # the cluster-wide `image`. Lets a lean CPU image run cluster-wide while
          # the GPU group pulls the full CUDA image — set `variant: cuda` on that
          # group (both built at the same Ray version). $img is defined above.
          containers:
            - name: ray-worker
              image: {{ printf "%s:%s" ($img.repository | default $.Values.image.repository) (include "modelship.imageTag" (dict "root" $ "tag" $img.tag "variant" $img.variant)) }}
              imagePullPolicy: {{ $img.pullPolicy | default $.Values.image.pullPolicy }}
              # RAY_ADDRESS is KubeRay's head Service address and GCS port.
              args:
                - join
                - --gcs-address
                - "$(RAY_ADDRESS)"
                {{- if $.Values.metrics.enabled }}
                - --metrics-port
                - {{ $.Values.metrics.port | quote }}
                {{- end }}
              # `serve` is the node's Ray Serve HTTP proxy port, targeted by the gateway Service.
              ports:
                - { name: serve, containerPort: {{ $.Values.gateway.port }} }
                - { name: metrics, containerPort: {{ $.Values.metrics.port }} }
              # Serve runs a proxy only on nodes hosting a replica: the pod is Ready only while it
              # answers, so the gateway Service skips the rest. Liveness stays KubeRay's.
              readinessProbe:
                httpGet:
                  path: /-/healthz
                  port: serve
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 2
              env:
                {{- include "modelship.env" $ | nindent 16 }}
                {{- include "modelship.nodeResourceEnv" (dict "resources" .resources "env" .env "container" "ray-worker") | nindent 16 }}
                {{- with .env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              envFrom:
                {{- include "modelship.envFrom" $ | nindent 16 }}
              resources:
                {{- toYaml .resources | nindent 16 }}
              volumeMounts:
                {{- include "modelship.volumeMounts" $ | nindent 16 }}
          volumes:
            {{- include "modelship.volumes" $ | nindent 12 }}
          {{- with .nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- end }}
  {{- end }}
