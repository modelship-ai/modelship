apiVersion: v1
kind: Service
metadata:
  name: {{ include "modelship.fullname" . }}-gateway
  labels:
    {{- include "modelship.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Routes to the `serve` port of every Ray pod (head + workers; KubeRay stamps
  # `ray.io/cluster` on each). Serve runs a proxy only on nodes hosting a replica.
  selector:
    ray.io/cluster: {{ include "modelship.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: serve
      protocol: TCP
