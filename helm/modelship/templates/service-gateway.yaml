apiVersion: v1
kind: Service
metadata:
  name: {{ include "modelship.fullname" . }}-gateway
  labels:
    {{- include "modelship.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Selects every Ray pod (KubeRay stamps `ray.io/cluster` on each); only Ready ones get
  # traffic, and a worker is Ready only while its Serve proxy answers.
  selector:
    ray.io/cluster: {{ include "modelship.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: serve
      protocol: TCP
