[project]
# Installed by the `mship` bootstrapper (bootstrap/), never directly by users.
name = "mship-engine"
version = "0.9.1"
description = "The production backend for self-hosted agents — the OpenAI Responses API with server-side conversation state (durable with Redis), universal tool calling, and reasoning, alongside embeddings, speech, and image generation, behind one OpenAI-compatible endpoint. Built on Ray Serve."
authors = [
    { name = "Alex Margarit" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
keywords = ["ai", "inference", "vllm", "ray", "ray-serve", "openai", "llm", "agentic", "tool-calling", "reasoning", "responses-api", "multimodal", "tts", "stt", "embeddings", "image-generation", "diffusers", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = "==3.12.10"
dependencies = [
    "argparse>=1.4.0",
    "asyncio>=4.0.0",
    "cryptography>=43.0.0",
    "fastapi>=0.116.1,<0.136.0",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "huggingface-hub>=1.18.0",
    "numpy>=2.2.6",
    "pydantic>=2.12.0",
    "pydantic-yaml>=1.6.0",
    "python-multipart>=0.0.20",
    "ray[data,default,serve-grpc]>=2.60.0,<2.61.0",
    "requests>=2.32.5",
    "psutil>=5.9",
    "redis>=8.0.0",
    "protobuf>=7.35.1,<8.0.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
thin = []
metal = [
    "librosa>=0.11.0",
    "numba>=0.61.0",
    "scipy>=1.16.1",
    "soundfile>=0.13.0",
    "stable-diffusion-cpp-python>=0.4.7",
    "pywhispercpp>=1.5.0",
    "sherpa-onnx>=2.0.1",
    "sherpa-onnx-core==2.0.1",
    "piper-phonemize==1.5.9 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki>=0.9.4",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "jaconv>=0.5.0",
    "mojimoji>=0.0.13",
]
cuda = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "transformers>=5.5.3",
    "flashinfer-python>=0.6.1",
    "vllm==0.32.0",
    "vllm[audio]==0.32.0",
    "bitsandbytes>=0.49.0",
    "diffusers>=0.42.1",
    "stable-diffusion-cpp-python>=0.4.7",
    "nvidia-ml-py",
    "librosa>=0.11.0",
    "numba>=0.61.0",
    "scipy>=1.16.1",
    "soundfile>=0.13.0",
    "pywhispercpp>=1.5.0",
    "sherpa-onnx>=2.0.1",
    "sherpa-onnx-core==2.0.1",
    "piper-phonemize==1.5.9 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "misaki>=0.9.4",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "jaconv>=0.5.0",
    "mojimoji>=0.0.13",
]
cpu = [
    "stable-diffusion-cpp-python>=0.4.7",
    "librosa>=0.11.0",
    "numba>=0.61.0",
    "scipy>=1.16.1",
    "soundfile>=0.13.0",
    "pywhispercpp>=1.5.0",
    "sherpa-onnx>=2.0.1",
    "sherpa-onnx-core==2.0.1",
    "piper-phonemize==1.5.9 ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "misaki>=0.9.4",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "jaconv>=0.5.0",
    "mojimoji>=0.0.13",
]
# Adds CPU-only vLLM on top of `cpu`.
vllm-cpu = [
    "torch==2.13.0+cpu ; sys_platform == 'linux'",
    "torchvision==0.28.0+cpu ; sys_platform == 'linux'",
    "torchaudio==2.11.0+cpu ; sys_platform == 'linux'",
    "transformers>=5.5.3",
    "vllm==0.32.0+cpu ; sys_platform == 'linux'",
    "vllm[audio]==0.32.0+cpu ; sys_platform == 'linux'",
    "triton==3.8.0+cpu ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
docs = [
    "mkdocs-material>=9.6.0",
]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pre-commit>=4.0.0",
    "fakeredis>=2.36.2",
]

# vLLM runs these in each of its processes
[project.entry-points."vllm.general_plugins"]
modelship_logging = "modelship.logging:configure_vllm_child_logging"

[project.urls]
Homepage = "https://github.com/modelship-ai/modelship"
Documentation = "https://docs.model-ship.ai/"
Issues = "https://github.com/modelship-ai/modelship/issues"
Changelog = "https://github.com/modelship-ai/modelship/blob/main/CHANGELOG.md"
Chat = "https://discord.gg/apbtTdk2Am"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "vllm-cpu"
url = "https://wheels.vllm.ai/0.32.0/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "vllm-cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "vllm-cpu" },
]
# vllm pulls torchaudio in transitively, but uv applies sources only to direct
# dependencies — hence the entries in the extras above. Without this it comes
# from PyPI, which ships one CUDA-linked build that cannot load on a cpu install.
torchaudio = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "vllm-cpu" },
]
vllm = [
  { index = "vllm-cpu", extra = "vllm-cpu" },
]
triton = [
  { url = "https://github.com/triton-lang/triton-cpu/releases/download/v3.8.0/triton-3.8.0+cpu-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", extra = "vllm-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
# Not on PyPI (PyPI `piper-phonemize` is rhasspy 1.1.0, no cp312); the extras
# pin the version, the URL rides here, one wheel per platform we ship.
piper-phonemize = [
  { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.9/piper_phonemize-1.5.9-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.9/piper_phonemize-1.5.9-cp312-cp312-manylinux2014_aarch64.manylinux_2_17_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { url = "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.9/piper_phonemize-1.5.9-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]

[tool.uv]
required-version = "==0.12.23"
override-dependencies = ["protobuf>=7.35.1,<8.0.0"]
conflicts = [
  [
    { extra = "cuda" },
    { extra = "cpu" },
  ],
  [
    { extra = "cuda" },
    { extra = "metal" },
  ],
  [
    { extra = "cuda" },
    { extra = "vllm-cpu" },
  ],
]

[tool.uv.build-backend]
module-name = "modelship"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["modelship"]
exclude = [".cache", ".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
]
# CJK punctuation the TTS frontends normalize by hand — not typos for ASCII.
allowed-confusables = ["，", "。", "？", "！", "；", "：", "、", "．"]

[tool.ruff.lint.isort]
known-first-party = ["modelship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Ray cluster and external models",
    "llama_server: integration tests that exercise the llama_server loader",
    "vllm: integration tests that exercise the vllm loader",
    "diffusers: integration tests that exercise the diffusers loader",
    "stable_diffusion_cpp: integration tests that exercise the stable_diffusion_cpp loader",
    "whispercpp: integration tests that exercise the whispercpp loader",
    "sherpa_onnx: integration tests that exercise the sherpa_onnx loader",
    "autoscaling: integration test that exercises Ray Serve autoscaling (scale out/in under load)",
    "gateway_ha: integration test that exercises multi-replica gateway routing consistency",
    "gateway_autoscaling: integration test that exercises the gateway scaling out under load",
    "blue_green: integration test that exercises the blue_green replace-strategy cutover",
    "rescale: integration test that exercises a replica-count change applied to a live deployment",
    "deploy: integration tests that exercise mship deploy end to end (additive, still coming up, two gateways, remote)",
    "cluster_join: integration test that exercises the --gcs-address multi-node cluster join with and without a token",
    "fractional_gpu_sharing: integration test that exercises two loaders sharing one physical GPU via fractional num_gpus",
    "node_logging: integration test that exercises per-node logging on a replica scheduled on a joined node",
    "state_store: integration tests that run the same /v1/responses requests on memory:// and on a real redis-server",
    "mship_stop: integration tests that run mship stop against their own head and joined node",
    "own_head: integration tests that start their own mship head; they run before the session cluster starts",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "/"
venv = ".venv"
include = ["modelship"]
exclude = [".cache", ".venv"]
typeCheckingMode = "basic"
