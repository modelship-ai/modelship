models:
  - name: "llm"
    # Repo name says AWQ; the format is compressed-tensors int4.
    model: "cyankiwi/Qwen3.5-9B-AWQ-4bit"
    usecase: "generate"
    loader: "vllm"
    num_gpus: 0.9
    # Lift Ray Serve's per-replica concurrency cap (default 100) so the model
    # deployment isn't the bottleneck during the sweep.
    max_ongoing_requests: 256
    # Engine sizing unset: both arms run the same preflight and derivations.
    vllm_engine_kwargs:
      tensor_parallel_size: 1
