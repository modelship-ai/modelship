models:
  - name: "llm"
    # Unquantized: the vllm+cpu wheel has no CPU AWQ/GPTQ kernels.
    model: "Qwen/Qwen3-0.6B"
    usecase: "generate"
    loader: "vllm"
    num_gpus: 0
    num_cpus: 8
    # Lift Ray Serve's per-replica concurrency cap (default 100) so the model
    # deployment isn't the bottleneck during the sweep.
    max_ongoing_requests: 256
    # Engine sizing unset: both arms run the same preflight and derivations.
    # On CPU vLLM auto-fits the context inside preflight's RAM reservation.
    vllm_engine_kwargs:
      tensor_parallel_size: 1
