[project]
name = "mship"
version = "0.7.15"
description = "Installer for modelship — provisions a pinned Python 3.12.10 environment for the selected node variant and runs the mship engine inside it."
authors = [
    { name = "Alex Margarit" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
keywords = ["ai", "inference", "vllm", "ray", "ray-serve", "openai", "llm", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Loose on purpose: runs on whatever interpreter the installer picked.
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mship = "mship_bootstrap.cli:main"

[project.urls]
Homepage = "https://github.com/modelship-ai/modelship"
Repository = "https://github.com/modelship-ai/modelship"
Documentation = "https://modelship-ai.github.io/modelship/"
Chat = "https://discord.gg/apbtTdk2Am"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mship_bootstrap"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
