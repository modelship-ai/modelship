<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" role="img" aria-label="Modelship architecture diagram" font-family="Helvetica, Arial, sans-serif">
  <title>Modelship architecture</title>
  <desc>An agent app calls Modelship over HTTP. One Ray Serve HTTP proxy on port 8000 fronts any number of gateways, each mounted at its own route prefix and each replicated: the "modelship" gateway at /modelship/v1 exposes chat, embeddings, audio, and image endpoints plus a highlighted Responses API with reasoning, tool calling, and streaming, and a second "team-a" gateway at /team-a/v1 serves the same API with its own model set. Both share one conversation-state store backed by a Ray actor or Redis. Requests are routed to Ray Serve deployments running across multiple cluster nodes on GPU or CPU.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EAF0F7"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4FD3DE"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="20" y="260" width="170" height="100" rx="10" fill="none" stroke="#EAF0F7" stroke-width="2"/>
  <text x="105" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#EAF0F7">Agent App</text>
  <text x="105" y="326" text-anchor="middle" font-size="12" fill="#9FB3C8">OpenAI SDK / curl</text>

  <!-- Arrow client -> proxy -->
  <line x1="190" y1="310" x2="243" y2="310" stroke="#EAF0F7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="216" y="300" text-anchor="middle" font-size="11" fill="#9FB3C8">HTTP</text>

  <!-- Ray Serve HTTP proxy: one port, many gateways -->
  <rect x="248" y="26" width="460" height="378" rx="14" fill="none" stroke="#EAF0F7" stroke-width="2"/>
  <text x="478" y="49" text-anchor="middle" font-size="13" font-weight="600" fill="#9FB3C8">Ray Serve HTTP proxy · :8000</text>

  <!-- Gateway 1 -->
  <rect x="262" y="62" width="432" height="270" rx="12" fill="none" stroke="#EAF0F7" stroke-width="2"/>
  <text x="478" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#EAF0F7">Gateway · modelship</text>
  <text x="478" y="107" text-anchor="middle" font-size="11.5" fill="#9FB3C8">/modelship/v1/*  ·  × N replicas</text>

  <!-- Endpoint chips -->
  <rect x="280" y="120" width="192" height="32" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="376" y="140" text-anchor="middle" font-size="12.5" fill="#EAF0F7">/v1/chat/completions</text>

  <rect x="280" y="158" width="192" height="32" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="376" y="178" text-anchor="middle" font-size="12.5" fill="#EAF0F7">/v1/embeddings</text>

  <rect x="280" y="196" width="192" height="32" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="376" y="216" text-anchor="middle" font-size="12.5" fill="#EAF0F7">/v1/audio/*</text>

  <rect x="280" y="234" width="192" height="32" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="376" y="254" text-anchor="middle" font-size="12.5" fill="#EAF0F7">/v1/images/*</text>

  <!-- Responses highlight -->
  <rect x="484" y="120" width="192" height="146" rx="8" fill="#4FD3DE" fill-opacity="0.12" stroke="#4FD3DE" stroke-width="2.5"/>
  <text x="580" y="144" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4FD3DE">/v1/responses</text>
  <text x="502" y="168" font-size="12.5" fill="#EAF0F7">• reasoning</text>
  <text x="502" y="190" font-size="12.5" fill="#EAF0F7">• tool calling</text>
  <text x="502" y="212" font-size="12.5" fill="#EAF0F7">• stored state</text>
  <text x="502" y="234" font-size="12.5" fill="#EAF0F7">• streaming</text>

  <!-- Auth row -->
  <rect x="280" y="282" width="192" height="32" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="376" y="303" text-anchor="middle" font-size="12" fill="#EAF0F7">API-key auth</text>

  <rect x="484" y="282" width="192" height="32" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="580" y="303" text-anchor="middle" font-size="12" fill="#EAF0F7">Cluster token auth</text>

  <!-- Gateway 2: same API, own route prefix and model set -->
  <rect x="262" y="344" width="432" height="46" rx="10" fill="none" stroke="#9FB3C8" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="478" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#EAF0F7">Gateway · team-a  →  /team-a/v1/*</text>
  <text x="478" y="381" text-anchor="middle" font-size="10.5" fill="#9FB3C8">same API surface, its own model set — any number per cluster</text>

  <!-- connector proxy -> shared state -->
  <line x1="478" y1="404" x2="478" y2="422" stroke="#4FD3DE" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Conversation state -->
  <rect x="262" y="424" width="432" height="62" rx="8" fill="none" stroke="#EAF0F7" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="478" y="448" text-anchor="middle" font-size="14" font-weight="600" fill="#EAF0F7">Conversation State</text>
  <text x="478" y="468" text-anchor="middle" font-size="10.5" fill="#9FB3C8">Ray actor or Redis — shared by every gateway, replica &amp; node</text>

  <!-- Arrows gateways -> nodes -->
  <line x1="708" y1="170" x2="758" y2="140" stroke="#EAF0F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="708" y1="372" x2="758" y2="412" stroke="#EAF0F7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="731" y="272" text-anchor="middle" font-size="11" fill="#9FB3C8">routes to</text>

  <!-- Node A -->
  <rect x="760" y="40" width="380" height="230" rx="12" fill="none" stroke="#EAF0F7" stroke-width="2"/>
  <text x="950" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#EAF0F7">Node · GPU</text>
  <text x="950" y="86" text-anchor="middle" font-size="11" fill="#9FB3C8">Ray Serve deployments</text>

  <rect x="780" y="100" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="862" y="124" text-anchor="middle" font-size="12.5" fill="#EAF0F7">LLM · vLLM</text>
  <text x="862" y="144" text-anchor="middle" font-size="11" fill="#9FB3C8">70% GPU</text>

  <rect x="955" y="100" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="1037" y="124" text-anchor="middle" font-size="12.5" fill="#EAF0F7">TTS</text>
  <text x="1037" y="144" text-anchor="middle" font-size="11" fill="#9FB3C8">5% GPU</text>

  <rect x="780" y="170" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="862" y="194" text-anchor="middle" font-size="12.5" fill="#EAF0F7">Embeddings</text>
  <text x="862" y="214" text-anchor="middle" font-size="11" fill="#9FB3C8">vLLM</text>

  <rect x="955" y="170" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="1037" y="194" text-anchor="middle" font-size="12.5" fill="#EAF0F7">STT</text>
  <text x="1037" y="214" text-anchor="middle" font-size="11" fill="#9FB3C8">llama.cpp</text>

  <!-- Node B -->
  <rect x="760" y="300" width="380" height="230" rx="12" fill="none" stroke="#EAF0F7" stroke-width="2"/>
  <text x="950" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#EAF0F7">Node · CPU (or GPU)</text>
  <text x="950" y="346" text-anchor="middle" font-size="11" fill="#9FB3C8">Ray Serve deployments</text>

  <rect x="780" y="360" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="862" y="384" text-anchor="middle" font-size="12.5" fill="#EAF0F7">LLM · llama.cpp</text>
  <text x="862" y="404" text-anchor="middle" font-size="11" fill="#9FB3C8">CPU-only</text>

  <rect x="955" y="360" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="1037" y="384" text-anchor="middle" font-size="12.5" fill="#EAF0F7">Image gen</text>
  <text x="1037" y="404" text-anchor="middle" font-size="11" fill="#9FB3C8">Diffusers</text>

  <rect x="780" y="430" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5"/>
  <text x="862" y="454" text-anchor="middle" font-size="12.5" fill="#EAF0F7">Embeddings</text>
  <text x="862" y="474" text-anchor="middle" font-size="11" fill="#9FB3C8">CPU</text>

  <rect x="955" y="430" width="165" height="60" rx="6" fill="none" stroke="#9FB3C8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1037" y="464" text-anchor="middle" font-size="12" fill="#9FB3C8">+ more nodes…</text>

  <!-- caption -->
  <text x="600" y="580" text-anchor="middle" font-size="13" fill="#9FB3C8">One port, many gateways. Shared state, not siloed per replica. Any number of nodes — GPU or CPU.</text>
</svg>
